<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangzhou Weekend</title>
  <meta name="description" content="Programme, réservations et infos du week-end à Hangzhou (28–29 novembre 2026).">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hangzhou">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">杭</span>
      <div>
        <h1>Hangzhou</h1>
        <p class="sub" id="subtitle"></p>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
  </header>

  <main>
    <section id="view-prog" class="view active" aria-label="Programme">
      <div class="daytabs" role="tablist" id="daytabs"></div>
      <p class="sun" id="sun"></p>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="view-resa" class="view" aria-label="Réservations">
      <h2>À réserver</h2>
      <p class="lead" id="resa-progress"></p>
      <div id="resa-list" class="stack"></div>
      <p class="note">Vos saisies restent uniquement sur ce téléphone.</p>
    </section>

    <section id="view-infos" class="view" aria-label="Infos">
      <h2>Infos & contraintes</h2>
      <div id="infos-list" class="stack"></div>
      <h2>Budget estimé</h2>
      <div class="card"><table class="budget" id="budget"></table></div>
      <h2>Phrases utiles</h2>
      <p class="lead">Touchez une phrase pour l'afficher en grand.</p>
      <div id="phrases" class="stack tight"></div>
    </section>

    <section id="view-taxi" class="view" aria-label="Chauffeur">
      <h2>Montrer au chauffeur</h2>
      <p class="lead">Touchez un lieu : le nom et l'adresse s'affichent en grand, en chinois.</p>
      <div id="taxi-list" class="stack tight"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button data-view="prog" class="active"><span aria-hidden="true">🗓</span>Programme</button>
    <button data-view="resa"><span aria-hidden="true">✅</span>Résas</button>
    <button data-view="infos"><span aria-hidden="true">ℹ️</span>Infos</button>
    <button data-view="taxi"><span aria-hidden="true">🚕</span>Chauffeur</button>
  </nav>

  <div class="overlay" id="overlay" hidden>
    <button class="close" id="overlay-close" aria-label="Fermer">✕</button>
    <div class="big" id="overlay-body"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
